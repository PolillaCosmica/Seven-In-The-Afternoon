<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven in the afternoon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
        }

        /* Contenedor del fondo cósmico */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* El 0.5 opaca sutilmente las estrellas para que el texto resalte */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('image_6975de.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Centrado del Texto */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .mensaje-criptico {
            color: #ffffff;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-align: center;
            line-height: 1.6;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            user-select: none;
            max-width: 900px;
        }

        @media (max-width: 600px) {
            .mensaje-criptico {
                font-size: 1.1rem;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-wrapper">
        <div class="mensaje-criptico">
            ☾#9?|87_⊹!7⊹35!@~5#!8⊹9/37|130⊹94+30⊹371⊹9#!3?|!8⊹3#⊹985!|8#☽
        </div>
    </div>

</body>
</html>
